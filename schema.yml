components:
  schemas:
    AdminAnswerDelete:
      type: object
      description: |-
        DELETE api/v1/admin/qna/answers/{answer_id}
        admin 답변 삭제 API 응답 serializer
      properties:
        answer_id:
          type: integer
          readOnly: true
        deleted_comment_count:
          type: integer
          readOnly: true
      required:
      - answer_id
      - deleted_comment_count
    AdminCategoryCreateResponse:
      type: object
      properties:
        category_id:
          type: integer
        name:
          type: string
          maxLength: 15
        parent_id:
          type: integer
          nullable: true
          readOnly: true
        category_type:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category_id
      - category_type
      - created_at
      - name
      - parent_id
    AdminCategoryList:
      type: object
      properties:
        category_id:
          type: integer
        name:
          type: string
          maxLength: 15
        category_type:
          type: string
          nullable: true
          readOnly: true
        parent_category:
          type: string
          nullable: true
          readOnly: true
        child_categories:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category_id
      - category_type
      - child_categories
      - created_at
      - name
      - parent_category
      - updated_at
    AdminExamDeploymentCreateRequest:
      type: object
      properties:
        exam_id:
          type: integer
        cohort_id:
          type: integer
        duration_time:
          type: integer
          maximum: 99
          minimum: 1
          default: 60
        open_at:
          type: string
          format: date-time
        close_at:
          type: string
          format: date-time
      required:
      - close_at
      - cohort_id
      - exam_id
      - open_at
    AdminExamDeploymentList:
      type: object
      properties:
        id:
          type: integer
        submit_count:
          type: integer
        avg_score:
          type: number
          format: double
          nullable: true
        exam:
          $ref: '#/components/schemas/ExamSummary'
        subject:
          $ref: '#/components/schemas/SubjectSummary'
        cohort:
          $ref: '#/components/schemas/CohortSummary'
        status:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - avg_score
      - cohort
      - created_at
      - exam
      - id
      - status
