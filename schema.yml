openapi: 3.0.3
info:
  title: 오즈 코딩 스쿨 Backend API
  version: 1.0.0
  description: 오즈 코딩 스쿨의 웹 사이트 개발을 위한 API입니다.
paths:
  /api/v1/accounts/available-courses:
    get:
      operationId: v1_accounts_available_courses_retrieve
      description: 모집 중인 기수만 소속된 과정 정보와 함께 반환합니다
      summary: 수강신청 가능한 기수 조회 API
      tags:
      - accounts
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableCourses'
          description: ''
        '401':
          description: 자격 인증 데이터가 제공되지 않았습니다.
  /api/v1/accounts/check-nickname:
    post:
      operationId: v1_accounts_check_nickname_create
      description: 로그인 유저는 닉네임 중복 확인 검사 가능
      summary: 닉네임 중복 확인 API
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckNicknameRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckNicknameRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckNicknameRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckNickname'
          description: ''
        '400':
          description: 이 필드는 필수 항목입니다.
        '409':
          description: 중복된 닉네임이 존재합니다.
  /api/v1/accounts/enroll-student:
    post:
      operationId: v1_accounts_enroll_student_create
      description: 로그인한 유저만 과정과 기수를 선택하여 수강생 등록 신청할 수 있습니다
      summary: 수강생 등록 신청 API
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '201':
          description: 수강생 등록 신청완료.
        '400':
          description: 이 필드는 필수 항목입니다.
        '401':
          description: 자격 인증 데이터가 제공되지 않았습니다.
  /api/v1/accounts/find_password:
    post:
      operationId: v1_accounts_find_password_create
      description: 이메일 인증 후 발급받은 토큰을 활용하여 유저 비밀번호 재설정
      summary: 비밀번호 분실시 재설정 api
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FindPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FindPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          description: 비밀번호 재설정 성공
        '400':
          description: 유효성 검사 실패
  /api/v1/accounts/login:
    post:
      operationId: v1_accounts_login_create
      description: 이메일과 비밀번호로 로그인합니다. Access 토큰은 바디로, Refresh 토큰은 쿠키로 반환됩니다.
      summary: 이메일 로그인 API
      tags:
      - Account(로그인)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          description: 로그인 성공
        '400':
          description: 유효성 검사 실패
        '403':
          description: 비활성화 계정,탈퇴 계정,로그인 정보 불일치
  /api/v1/accounts/logout:
    post:
      operationId: v1_accounts_logout_create
      summary: 로그아웃 API
      tags:
      - Account(로그인)
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: 로그아웃 성공
  /api/v1/accounts/me:
    get:
      operationId: v1_accounts_me_retrieve
      description: 로그인한 유저는 회원정보 조회가능, 수강생 등록이 되어있을 경우 수강중 과정, 기수도 조회가능
      summary: 내 정보 조회 API
      tags:
      - accounts
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
          description: ''
        '401':
          description: 자격 인증 데이터가 제공되지 않았습니다.
    patch:
      operationId: v1_accounts_me_partial_update
      description: 로그인한 유저는 닉네임, 이름, 생년월일, 성별 수정 가능
      summary: 내 정보 수정 API
      tags:
      - Accounts (회원관리)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserInfoUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserInfoUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserInfoUpdateRequest'
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoUpdateResponse'
          description: ''
        '400':
          description: 잘못된 요청
        '401':
          description: 인증 실패
        '409':
          description: 중복된 닉네임
  /api/v1/accounts/me/enrolled-courses:
    get:
      operationId: v1_accounts_me_enrolled_courses_list
      description: 로그인한 유저의 수강목록만 조회
      summary: 내 수강목록 조회 API
      tags:
      - accounts
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyCourses'
          description: ''
        '401':
          description: 자격 인증 데이터가 제공되지 않았습니다.
        '403':
          description: 수강 목록 조회 권한이 없습니다.
  /api/v1/accounts/me/profile-image:
    patch:
      operationId: v1_accounts_me_profile_image_partial_update
      summary: 프로필 이미지 URL 저장
      tags:
      - accounts
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: No response body
  /api/v1/accounts/me/profile-image/presigned-url:
    post:
      operationId: v1_accounts_me_profile_image_presigned_url_create
      tags:
      - v1
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: No response body
    put:
      operationId: v1_accounts_me_profile_image_presigned_url_update
      tags:
      - v1
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: No response body
  /api/v1/accounts/me/refresh:
    post:
      operationId: v1_accounts_me_refresh_create
      description: HttpOnly 쿠키의 refresh_token으로 새 access_token 발급. refresh_token도
        갱신됨.
      summary: JWT 토큰 재발급 API
      tags:
      - Account(로그인)
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          description: 토큰 재발급 성공
        '400':
          description: refresh 쿠키 없음
        '403':
          description: 유효하지 않은 토큰
  /api/v1/accounts/restore:
    post:
      operationId: v1_accounts_restore_create
      description: 이메일 인증 후 발급된 email_token으로 계정을 복구합니다. 토큰은 10분간 유효합니다.
      summary: 계정 복구
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          description: 계정 복구 완료
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreValidationError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreNotFound'
          description: ''
  /api/v1/accounts/signup:
    post:
      operationId: v1_accounts_signup_create
      description: 새로운 유저를 생성합니다. 이메일 중복 시 409 에러를 반환합니다.
      summary: 회원가입
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
  /api/v1/accounts/social-login/{provider}/:
    get:
      operationId: v1_accounts_social_login_retrieve
      description: 지정된 provider의 OAuth 인증 URL로 리다이렉트합니다.
      summary: 소셜 로그인 리다이렉트
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - accounts
      security:
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '302':
          description: No response body
  /api/v1/accounts/social-login/{provider}/callback/:
    get:
      operationId: v1_accounts_social_login_callback_retrieve
      description: OAuth 콜백 코드를 처리하고 프론트엔드로 리다이렉트합니다. 성공 시 refresh_token 쿠키를 설정합니다.
      summary: 소셜 로그인 콜백 처리
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - accounts
      security:
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '302':
          description: No response body
  /api/v1/accounts/verification/send-email:
    post:
      operationId: v1_accounts_verification_send_email_create
      description: 회원가입, 비밀번호 찾기, 계정 복구 등 용도(purpose)에 맞는 6자리 이메일 인증 코드를 발송합니다.
      summary: 이메일 인증 코드 발송 API
      tags:
      - Accounts (이메일 인증)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          description: 발송 성공
        '400':
          description: 잘못된 요청 (유효성 검사 실패 등)
  /api/v1/accounts/verification/send-sms:
    post:
      operationId: v1_accounts_verification_send_sms_create
      description: 회원가입, 이메일 찾기, 전화번호 변경 등 용도(purpose)에 맞는 6자리 sms 인증 코드를 발송합니다.
      summary: sms 인증 코드 발송 API
      tags:
      - Accounts (sms 인증)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          description: 발송 성공
        '400':
          description: 잘못된 요청 (유효성 검사 실패 등)
  /api/v1/accounts/verification/verify-email:
    post:
      operationId: v1_accounts_verification_verify_email_create
      description: 사용자가 입력한 6자리 인증 코드를 검증하고, 성공 시 다음 단계(회원가입 등)를 위한 email_token을 반환합니다.
      summary: 이메일 인증 코드 검증 API
      tags:
      - Accounts (이메일 인증)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          description: 검증 성공
        '400':
          description: 잘못된 요청 (코드 불일치 또는 만료)
  /api/v1/accounts/verification/verify-sms:
    post:
      operationId: v1_accounts_verification_verify_sms_create
      description: 사용자가 입력한 6자리 인증 코드를 검증하고, 성공 시 다음 단계(회원가입 등)를 위한 sms_token을 반환합니다.
      summary: sms 인증 코드 검증 API
      tags:
      - Accounts (sms 인증)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SmsVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SmsVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          description: 검증 성공
        '400':
          description: 잘못된 요청 (코드 불일치 또는 만료)
  /api/v1/accounts/withdrawal:
    delete:
      operationId: v1_accounts_withdrawal_destroy
      description: 탈퇴 신청 후 2주간 데이터가 보관되며, 2주 내 계정 복구가 가능합니다. 2주 후 완전 삭제됩니다.
      summary: 회원 탈퇴
      tags:
      - accounts
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '204':
          description: 탈퇴 처리 완료
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalValidationError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalUnauthorized'
          description: ''
  /api/v1/admin/accounts:
    get:
      operationId: v1_admin_accounts_retrieve
      description: 어드민 전용 회원 목록 조회 API입니다. 검색, 상태/역할 필터, 페이지네이션을 지원합니다.
      summary: 어드민 회원 목록 조회
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: '페이지 번호 (기본값: 1)'
      - in: query
        name: page_size
        schema:
          type: integer
        description: '페이지당 항목 수 (기본값: 10, 최대: 100)'
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - staff
          - student
          - user
        description: 회원 역할 필터
      - in: query
        name: search
        schema:
          type: string
        description: 이메일 또는 닉네임으로 검색
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - inactive
          - withdrew
        description: 회원 상태 필터
      tags:
      - admin_accounts
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: 어드민 회원목록 조회를 성공했습니다.
        '400':
          description: 유효하지 않은 요청 파라미터입니다.
        '401':
          description: 자격 인증 데이터가 제공되지 않았습니다.
        '403':
          description: 권한이 없습니다.
  /api/v1/admin/accounts/{account_id}:
    get:
      operationId: v1_admin_accounts_retrieve_2
      description: 어드민 전용 특정 회원의 상세 정보를 조회하는 API입니다.
      summary: 어드민 회원 상세 조회
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - admin_accounts
      security:
      - jwtAuth: []
      - BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: 어드민 회원 정보 상세 조회를 성공했습니다.
        '401':
          description: 자격 인증 데이터가 제공되지 않았습니다.
        '403':
          description: 권한이 없습니다.
        '404':
          description: 사용자 정보를 찾을 수 없습니다.
  /api/v1/admin/accounts/{account_id}/update:
    patch:
      operationId: v1_admin_accounts_update_partial_update
